<style>

*{box-sizing:border-box}

</style></head><body>
<div id="app"><div class="bar"><b id="ttl">Dek</b><button class="ib" id="hb" onclick="addMenu()">＋</button></div><div id="pg"></div>
<nav><button data-k="decks" class="on"><i>🗂</i>Dek</button><button data-k="browse"><i>🔍</i>Cari</button><button data-k="stats"><i>📊</i>Statistik</button><button data-k="set"><i>⚙️</i>Setelan</button></nav></div>
<div id="rv" class="hidden"><div class="bar"><button class="ib" onclick="closeRv()">←</button><div class="cnt" id="rc"></div><button class="ib" onclick="rvMenu()">⋮</button></div><div id="cb" onclick="cardTap(event)"><div id="host"></div></div><div class="foot" id="rf"></div></div>

<input type="file" id="fi" style="position:fixed;left:-9999px;width:1px;height:1px;opacity:0" onchange="doImport(this.files[0]);this.value=''">
<script>
const $=s=>document.querySelector(s),H=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let IDB;const DAY=864e5,today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4-144e5)/DAY),uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const opn=()=>new Promise((r,j)=>{const q=indexedDB.open('nihongo_anki',1);q.onupgradeneeded=()=>['kv','notes','cards','media'].forEach(n=>q.result.createObjectStore(n));q.onsuccess=()=>{IDB=q.result;r()};q.onerror=()=>j(q.error)});
const PM=(s,a)=>new Promise((r,j)=>{const t=IDB.transaction(s,'readwrite'),o=t.objectStore(s);a.forEach(([k,v])=>v===undefined?o.delete(k):o.put(v,k));t.oncomplete=r;t.onerror=()=>j(t.error)});
const G=(s,k)=>new Promise(r=>{const q=IDB.transaction(s).objectStore(s).get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()});
const A=s=>new Promise(r=>{const q=IDB.transaction(s).objectStore(s).getAll();q.onsuccess=()=>r(q.result)});
let S={decks:{},models:{},cfg:{nd:20,rd:200,steps:[1,10],auto:true,theme:'dark'},cnt:{d:0,n:{},r:{}},hist:{}},notes=new Map,cards=new Map,tab='decks',col=new Set,cur=null,ans=false,deckN='',undoS=null,typed='';
const saveMeta=()=>PM('kv',[['meta',S]]),saveC=c=>{cards.set(c.id,c);return PM('cards',[[c.id,c]])};
const BASIC={id:'basic',name:'Basic',type:0,flds:['Front','Back'],css:'',tmpls:[{name:'Card 1',qfmt:'{{Front}}',afmt:'{{FrontSide}}<hr id=answer>{{Back}}'}]};
async function init(){await opn();const m=await G('kv','meta');if(m)Object.assign(S,m);S.models.basic=S.models.basic||BASIC;
for(const n of await A('notes'))notes.set(n.id,n);for(const c of await A('cards'))cards.set(c.id,c);
if(!m){try{const o=JSON.parse(localStorage.getItem('nihongo_master_v2_cards')||'[]');for(const x of o){if(x.id<10||!x.front)continue;await mkNote('basic',x.deck||'Kartu saya',[x.front,x.back||''],'',1)}}catch(e){}}
if(S.cnt.d!==today())S.cnt={d:today(),n:{},r:{}};theme(S.cfg.theme);await saveMeta();go('decks');navigator.storage?.persist?.();
if(navigator.onLine)['sql-wasm.js','sql-wasm.wasm'].forEach(f=>fetch(SQL_CDN+f).catch(()=>{}))}
const SQL_CDN='https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/';
function theme(t){S.cfg.theme=t;document.documentElement.dataset.t=t}
function deckId(name){let d=Object.values(S.decks).find(x=>x.name===name);if(!d){d={id:uid(),name};S.decks[d.id]=d}return d.id}
async function mkNote(mid,deck,f,tags,quiet){const n={id:uid(),mid,f,tags:tags||''},did=deckId(deck),cs=[],md=S.models[mid];let pos=[...cards.values()].reduce((a,c)=>Math.max(a,c.t==0?c.due:0),0)+1;
const ords=md.type==1?[...new Set([...f.join(' ').matchAll(/\{\{c(\d+)::/g)].map(x=>+x[1]-1))]:md.tmpls.map((_,i)=>i);
ords.forEach((o,i)=>cs.push({id:uid()+i,nid:n.id,did,ord:o,t:0,due:pos+i,ivl:0,f:2500,r:0,l:0,q:0}));
notes.set(n.id,n);cs.forEach(c=>cards.set(c.id,c));await PM('notes',[[n.id,n]]);await PM('cards',cs.map(c=>[c.id,c]));if(!quiet)await saveMeta();return n}
/* ---------- penjadwal (SM-2 ala Anki) ---------- */
function sched(o,r){const c={...o},st=S.cfg.steps,td=today(),now=Date.now();
const grad=v=>{c.t=2;c.rl=0;c.ivl=Math.max(1,Math.round(v));c.due=td+c.ivl;c.s=0},lrn=(i,a)=>{c.t=1;c.s=i;c.due=now+a[i]*6e4};
if(o.t==2){const iv=o.ivl,f=o.f||2500,h=Math.max(iv+1,Math.round(iv*1.2)),g=Math.max(h+1,Math.round(iv*f/1000)),e=Math.max(g+1,Math.round(iv*f/1000*1.3));
if(r==1){c.l=(o.l||0)+1;c.f=Math.max(1300,f-200);c.ivl=Math.max(1,Math.round(iv*0));c.rl=1;lrn(0,[10])}
else if(r==2){c.f=Math.max(1300,f-150);grad(h)}else if(r==3)grad(g);else{c.f=f+150;grad(e)}}
else{const a=o.rl?[10]:st,i=o.t==0?0:o.s||0;c.f=c.f||2500;
if(r==1)lrn(0,a);else if(r==2)lrn(i,a);else if(r==3)i+1<a.length?lrn(i+1,a):grad(o.rl?o.ivl:1);else grad(o.rl?o.ivl+1:4)}
return c}
const lab=n=>{if(n.t==1){const m=Math.max(1,Math.round((n.due-Date.now())/6e4));return m<60?m+'m':Math.round(m/60)+'h'}const d=n.ivl;return d<30?d+'d':d<365?(d/30).toFixed(1).replace('.0','')+'mo':(d/365).toFixed(1)+'y'};
const subIds=name=>new Set(Object.values(S.decks).filter(d=>d.name===name||d.name.startsWith(name+'::')).map(d=>d.id));
const avail=c=>!c.q&&!(c.b>today());
function counts(name){const ids=subIds(name),td=today(),la=Date.now()+12e5;let n=0,l=0,r=0,dn=0,dr=0;
for(const c of cards.values()){if(!ids.has(c.did)||!avail(c))continue;if(c.t==0)n++;else if(c.t==1){if(c.due<=la)l++}else if(c.due<=td)r++}
for(const i of ids){dn+=S.cnt.n[i]||0;dr+=S.cnt.r[i]||0}return{n:Math.min(n,Math.max(0,S.cfg.nd-dn)),l,r:Math.min(r,Math.max(0,S.cfg.rd-dr))}}
function pick(name){const ids=subIds(name),td=today(),now=Date.now(),k=counts(name);let L=null,R=null,N=null,LA=null;
for(const c of cards.values()){if(!ids.has(c.did)||!avail(c))continue;
if(c.t==1){if(c.due<=now){if(!L||c.due<L.due)L=c}else if(c.due<=now+12e5&&(!LA||c.due<LA.due))LA=c}
else if(c.t==2){if(c.due<=td&&(!R||c.due<R.due))R=c}else if(!N||c.due<N.due)N=c}
return L||(k.r>0&&R)||(k.n>0&&N)||LA||null}
/* ---------- navigasi ---------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.k));
const TT={decks:'Dek',browse:'Cari kartu',stats:'Statistik',set:'Setelan'};
function go(k){tab=k;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));$('#ttl').textContent=TT[k];$('#hb').style.visibility=k=='decks'?'visible':'hidden';$('#pg').scrollTop=0;$('#pg').onclick=null;try{({decks:vDecks,browse:vBrowse,stats:vStats,set:vSet})[k]()}catch(e){pg('<p style="padding:16px;color:var(--rd)">Error: '+H(e.message)+'</p>')}}
const pg=h=>$('#pg').innerHTML=h;
function vDecks(){const names=new Set;Object.values(S.decks).forEach(d=>{const p=d.name.split('::');p.forEach((_,i)=>names.add(p.slice(0,i+1).join('::')))});
let list=[...names].sort((a,b)=>a.localeCompare(b)).filter(n=>n!=='Default'||[...cards.values()].some(c=>S.decks[c.did]?.name==='Default'));
const hasKid=n=>list.some(x=>x.startsWith(n+'::'));
const rows=list.filter(n=>{const p=n.split('::');return !p.slice(0,-1).some((_,i)=>col.has(p.slice(0,i+1).join('::')))}).map(n=>{const k=counts(n),p=n.split('::'),z=v=>v?'':' n0';
return`<div class="row" data-d="${H(n)}" style="padding-left:${14+(p.length-1)*18}px"><span data-t="${H(n)}" style="width:20px;color:var(--mut)">${hasKid(n)?(col.has(n)?'▸':'▾'):''}</span><span class="nm">${H(p[p.length-1])}</span><span class="cn${z(k.n)}" style="color:var(--bl)">${k.n}</span><span class="cn${z(k.l)}" style="color:var(--rd)">${k.l}</span><span class="cn${z(k.r)}" style="color:var(--gr)">${k.r}</span></div>`}).join('');
pg(`<div class="hh"><span style="flex:1"></span><span class="cn">Baru</span><span class="cn">Belajar</span><span class="cn">Ulang</span></div>${rows||'<p class="c mut" style="margin-top:60px">Belum ada dek.<br>Ketuk ＋ untuk impor .apkg atau tambah kartu.</p>'}`);
$('#pg').onclick=e=>{const t=e.target.closest('[data-t]');if(t){col.has(t.dataset.t)?col.delete(t.dataset.t):col.add(t.dataset.t);return vDecks()}const r=e.target.closest('[data-d]');if(r)overview(r.dataset.d)}}
function overview(n){const k=counts(n),any=k.n+k.l+k.r>0;deckN=n;$('#pg').onclick=null;$('#ttl').textContent=n.split('::').pop();
pg(`<div class="pn c"><h2 style="margin:6px 0 16px">${H(n)}</h2><div class="cnt" style="justify-content:center;font-size:20px"><span style="color:var(--bl)">${k.n} <small class=mut>baru</small></span><span style="color:var(--rd)">${k.l} <small class=mut>belajar</small></span><span style="color:var(--gr)">${k.r} <small class=mut>ulang</small></span></div>
${any?'':'<p class="mut" style="margin:18px 0">Selamat! Dek ini sudah selesai untuk saat ini.</p>'}<button class="btn p w" style="margin-top:18px" ${any?'':'disabled'} onclick="study()">Belajar sekarang</button><button class="btn w" style="margin-top:10px" onclick="go('decks')">← Kembali</button><button class="btn w" style="margin-top:10px;color:var(--rd)" onclick="delDeck()">Hapus dek</button></div>`)}
async function delDeck(){if(!confirm('Hapus dek ini beserta semua kartunya?'))return;const ids=subIds(deckN),del=[...cards.values()].filter(c=>ids.has(c.did));del.forEach(c=>cards.delete(c.id));ids.forEach(i=>delete S.decks[i]);await PM('cards',del.map(c=>[c.id,undefined]));await saveMeta();go('decks')}
/* ---------- reviewer ---------- */
function study(){$('#rv').classList.remove('hidden');undoS=null;nextCard()}
function closeRv(){$('#rv').classList.add('hidden');$('#host').replaceChildren();overview(deckN)}
function nextCard(){cur=pick(deckN);ans=false;typed='';if(!cur){$('#rv').classList.add('hidden');return overview(deckN)}paint();$('#cb').scrollTop=0}
function paint(){const k=counts(deckN),t=cur.t;$('#rc').innerHTML=`<span class="${t==0?'u':''}" style="color:var(--bl)">${k.n}</span><span class="${t==1?'u':''}" style="color:var(--rd)">${k.l}</span><span class="${t==2?'u':''}" style="color:var(--gr)">${k.r}</span>`;
showCard();$('#rf').innerHTML=ans?[1,2,3,4].map(r=>`<button onclick="answer(${r})"><small class="a${r}">${lab(sched(cur,r))}</small>${['Lagi','Sulit','Baik','Mudah'][r-1]}</button>`).join(''):`<button onclick="reveal()" style="font-size:17px">Tampilkan jawaban</button>`}
function reveal(){if(ans)return;const ti=$('#host').shadowRoot?.getElementById('typein');typed=ti?ti.value:'';ans=true;paint();const a=$('#host').shadowRoot.getElementById('answer');if(a)a.scrollIntoView({block:'start'})}
function cardTap(e){if(ans)return;if(e.composedPath().some(x=>x.matches?.('video,audio,a,input,button,.rp')))return;reveal()}
async function answer(r){const n=sched(cur,r);undoS={c:{...cur},cnt:JSON.stringify(S.cnt),h:S.hist[today()]||0};
if(cur.t==0)S.cnt.n[cur.did]=(S.cnt.n[cur.did]||0)+1;if(cur.t==2)S.cnt.r[cur.did]=(S.cnt.r[cur.did]||0)+1;S.hist[today()]=(S.hist[today()]||0)+1;n.r=(cur.r||0)+1;n.last=Date.now();
await saveC(n);await saveMeta();nextCard()}
async function undo(){if(!undoS)return;shut();cards.set(undoS.c.id,undoS.c);S.cnt=JSON.parse(undoS.cnt);S.hist[today()]=undoS.h;await saveC(undoS.c);await saveMeta();cur=undoS.c;undoS=null;ans=false;paint()}
function rvMenu(){sheet(`<button class="btn" onclick="undo()" ${undoS?'':'disabled'}>↩︎ Urungkan jawaban</button><button class="btn" onclick="shut();replay()">▶︎ Putar ulang media</button><button class="btn" onclick="shut();editNote(cur.nid,1)">✏️ Edit kartu</button><button class="btn" onclick="flag('b')">💤 Tunda sampai besok</button><button class="btn" onclick="flag('s')">⏸ Tangguhkan kartu</button><button class="btn" style="color:var(--rd)" onclick="flag('d')">🗑 Hapus catatan</button>`)}
async function flag(k){shut();const c=cur;if(k=='b')c.b=today()+1;if(k=='s')c.q=-1;if(k=='d'){if(!confirm('Hapus catatan ini?'))return;const del=[...cards.values()].filter(x=>x.nid==c.nid);del.forEach(x=>cards.delete(x.id));notes.delete(c.nid);await PM('cards',del.map(x=>[x.id,undefined]));await PM('notes',[[c.nid,undefined]])}else await saveC(c);nextCard()}
const replay=()=>{const m=$('#host').shadowRoot.querySelector('video,audio');if(m){m.currentTime=0;m.play().catch(()=>{})}};
/* ---------- render template Anki ---------- */
const strip=s=>String(s).replace(/<[^>]*>|&nbsp;/g,'').trim();
const clz=(v,o,a)=>v.replace(/\{\{c(\d+)::([\s\S]*?)(?:::([\s\S]*?))?\}\}/g,(_,n,t,h)=>+n==o?`<span class="cloze">${a?t:'['+(h||'...')+']'}</span>`:t);
const FUR=/([^ >\[\]]+)\[(?!sound:)(.+?)\]/g;
function tpl(t,f,c,a){let p;do{p=t;t=t.replace(/\{\{([#^])\s*([^}]+?)\s*\}\}([\s\S]*?)\{\{\/\s*\2\s*\}\}/g,(_,k,n,i)=>(strip(f[n]??'')!=='')==(k=='#')?i:'')}while(p!==t);
return t.replace(/\{\{\{?\s*([^}]+?)\s*\}?\}\}/g,(_,x)=>{const ps=x.split(':'),n=ps.pop();if(n=='FrontSide')return f.FrontSide||'';let v=f[n]??'';
for(const fl of ps.reverse()){if(fl=='cloze')v=clz(v,c.ord+1,a);else if(fl=='text')v=strip(v);else if(fl=='furigana')v=v.replace(FUR,'<ruby>$1<rt>$2</rt></ruby>');else if(fl=='kanji')v=v.replace(FUR,'$1');else if(fl=='kana')v=v.replace(FUR,'$2');
else if(fl=='hint')v=v?`<a class="hint" onclick="this.style.display='none';this.nextSibling.style.display='inline'">Petunjuk ${H(n)}</a><span style="display:none">${v}</span>`:'';
else if(fl=='type')v=a?`<div class="rp"><code>${H(typed)}</code><br><code>${H(strip(v))}</code></div>`:`<input id="typein" class="rp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">`}
return v})}
const EXT={mp4:'video/mp4',m4v:'video/mp4',webm:'video/webm',mov:'video/quicktime',mkv:'video/x-matroska',mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',ogg:'audio/ogg',wav:'audio/wav',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml'},mime=n=>EXT[n.split('.').pop().toLowerCase()]||'';
const dec=n=>{try{return decodeURIComponent(n)}catch{return n}};
function cardHtml(c,a){const n=notes.get(c.nid),m=S.models[n.mid]||BASIC,f={};m.flds.forEach((k,i)=>f[k]=n.f[i]||'');f.Tags=n.tags;f.Deck=S.decks[c.did]?.name||'';f.Card=(m.tmpls[c.ord]||m.tmpls[0]).name;f.Type=m.name;
const T=m.tmpls[c.ord]||m.tmpls[0];f.FrontSide=tpl(T.qfmt,f,c,false);let h=a?tpl(T.afmt,f,c,true):f.FrontSide;
h=h.replace(/\[sound:(.+?)\]/g,(_,s)=>/^video/.test(mime(s))?`<video controls playsinline preload="metadata" data-m="${H(s)}"></video>`:`<a class="rp pl" onclick="var x=this.nextSibling;x.paused?x.play():x.pause()">▶</a><audio data-m="${H(s)}"></audio>`);
h=h.replace(/(<(?:img|source|video|audio)\b[^>]*?\s)src=(["'])(?!https?:|data:|blob:)(.*?)\2/gi,'$1data-m=$2$3$2');return[h,m.css||'']}
const BASE=':host{display:block}.card{font-family:arial,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:22px;text-align:center;padding:18px 14px 30px;word-wrap:break-word;color:var(--ink)!important;background:transparent!important}img,video{max-width:100%;height:auto}video{display:block;margin:10px auto;border-radius:8px}hr{border:0;border-top:1px solid var(--ln)}.cloze{font-weight:700;color:var(--bl)}.hint{color:var(--bl);cursor:pointer;text-decoration:underline}.rp input,input.rp{font:inherit;width:90%;padding:8px;border-radius:8px;border:1px solid var(--ln);background:var(--pn);color:var(--ink)}.pl{display:inline-block;width:42px;height:42px;line-height:42px;border-radius:50%;background:var(--bt);margin:4px;cursor:pointer}code{font-size:20px}audio{display:none}.miss{display:none}';
const URLS=new Map;async function murl(n){if(URLS.has(n))return URLS.get(n);const b=await G('media',n);if(!b)return null;const u=URL.createObjectURL(b);if(URLS.size>40){const k=URLS.keys().next().value;URL.revokeObjectURL(URLS.get(k));URLS.delete(k)}URLS.set(n,u);return u}
async function showCard(){const [h,css]=cardHtml(cur,ans),host=$('#host'),r=host.shadowRoot||host.attachShadow({mode:'open'}),id=cur.id;
r.innerHTML=`<style>${BASE}${css.replace(/@import[^;]*;/g,'')}</style><div class="card">${h}</div>`;
for(const el of r.querySelectorAll('[data-m]')){const u=await murl(dec(el.dataset.m));if(id!==cur?.id)return;if(u){el.src=u;if(el.tagName=='SOURCE')el.parentNode.load()}else el.classList.add('miss')}
if(S.cfg.auto){const m=r.querySelector('video,audio');m?.play?.().catch(()=>{})}const t=r.getElementById('typein');if(t&&!ans)t.focus({preventScroll:true})}
/* ---------- cari / edit ---------- */
function vBrowse(){pg(`<div style="padding:8px 12px"><input id="q" placeholder="Cari teks, tag, atau dek…" oninput="bl()"></div><div id="bl"></div>`);bl()}
function bl(){const q=($('#q')?.value||'').toLowerCase();let out=[],tot=0;for(const n of notes.values()){const t=n.f.map(strip).join(' · '),d=S.decks[[...cards.values()].find(c=>c.nid==n.id)?.did]?.name||'';if(!q||(t+' '+n.tags+' '+d).toLowerCase().includes(q)){tot++;if(out.length<150)out.push(`<div class="row" onclick="editNote(${n.id})" style="display:block"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${H(t)}</div><small class="mut">${H(d)}</small></div>`)}}
$('#bl').innerHTML=`<p class="mut" style="margin:0 14px">${tot} catatan${tot>150?' (150 pertama)':''}</p>`+out.join('')}
function editNote(id,inRv){const n=notes.get(id),m=S.models[n.mid]||BASIC;sheet(`<h3 style="margin:0 0 8px">Edit catatan</h3>${m.flds.map((k,i)=>`<label class="mut">${H(k)}</label><textarea id="ef${i}">${H(n.f[i]||'')}</textarea>`).join('')}<label class="mut">Tag</label><input id="et" value="${H(n.tags)}"><button class="btn p w" style="text-align:center" onclick="saveNote(${id},${inRv||0})">Simpan</button>${inRv?'':`<button class="btn" style="text-align:center;color:var(--rd)" onclick="delNote(${id})">Hapus</button>`}`)}
async function saveNote(id,inRv){const n=notes.get(id);n.f=n.f.map((_,i)=>$('#ef'+i)?.value??n.f[i]);n.tags=$('#et').value;await PM('notes',[[id,n]]);shut();if(inRv)paint();else bl()}
async function delNote(id){if(!confirm('Hapus catatan ini?'))return;const del=[...cards.values()].filter(c=>c.nid==id);del.forEach(c=>cards.delete(c.id));notes.delete(id);await PM('cards',del.map(c=>[c.id,undefined]));await PM('notes',[[id,undefined]]);shut();bl()}
/* ---------- statistik & setelan ---------- */
function vStats(){const td=today(),t={n:0,l:0,y:0,m:0},fc=Array(7).fill(0);for(const c of cards.values()){if(c.t==0)t.n++;else if(c.t==1)t.l++;else{c.ivl>=21?t.m++:t.y++;const d=c.due-td;if(d<7)fc[Math.max(0,d)]++}}
const mx=Math.max(1,...fc),hs=Object.entries(S.hist).sort((a,b)=>a[0]-b[0]).slice(-7);
pg(`<div class="pn"><h3>Hari ini</h3><div style="font-size:26px;font-weight:700">${S.hist[td]||0} <small class="mut" style="font-size:14px">kartu dipelajari</small></div></div>
<div class="pn"><h3>Jumlah kartu · ${cards.size}</h3>${[['Baru',t.n,'#4da3ff'],['Belajar',t.l,'#ff6b6b'],['Muda (&lt;21h)',t.y,'#8fe388'],['Matang',t.m,'#1a9e3a']].map(([a,b,c])=>`<div class="row" style="padding:7px 0"><span style="width:14px;height:14px;background:${c};border-radius:3px"></span><span class="nm">${a}</span><b>${b}</b></div>`).join('')}</div>
<div class="pn"><h3>Perkiraan 7 hari</h3><div class="bars">${fc.map((v,i)=>`<div style="height:${v/mx*100}%"><span>${v}</span></div>`).join('')}</div><div class="hh" style="border:0;padding:4px 0">${fc.map((_,i)=>`<span style="flex:1;text-align:center">${i?'+'+i:'hari ini'}</span>`).join('')}</div></div>
<div class="pn"><h3>7 hari terakhir</h3>${hs.map(([d,v])=>`<div class="row" style="padding:6px 0"><span class="nm mut">${new Date((+d)*DAY+DAY/2).toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'})}</span><b>${v}</b></div>`).join('')||'<p class="mut">Belum ada data.</p>'}</div>`)}
function vSet(){const c=S.cfg;pg(`<div class="pn"><h3>Tampilan</h3><button class="btn w" onclick="theme(S.cfg.theme=='dark'?'light':'dark');saveMeta();vSet()">${c.theme=='dark'?'☀️ Ganti ke mode terang':'🌙 Ganti ke mode gelap'}</button></div>
<div class="pn"><h3>Belajar</h3><label class="mut">Kartu baru per hari</label><input type="number" inputmode="numeric" value="${c.nd}" onchange="S.cfg.nd=Math.max(0,+this.value||0);saveMeta()"><label class="mut">Maks ulangan per hari</label><input type="number" inputmode="numeric" value="${c.rd}" onchange="S.cfg.rd=Math.max(0,+this.value||0);saveMeta()"><label class="mut">Langkah belajar (menit, pisah spasi)</label><input value="${c.steps.join(' ')}" onchange="S.cfg.steps=this.value.split(/[ ,]+/).map(Number).filter(x=>x>0);if(!S.cfg.steps.length)S.cfg.steps=[1,10];saveMeta()">
<label style="display:flex;gap:10px;align-items:center"><input type="checkbox" style="width:22px;margin:0" ${c.auto?'checked':''} onchange="S.cfg.auto=this.checked;saveMeta()">Putar video/audio otomatis</label></div>
<div class="pn"><h3>Data</h3><button class="btn p w" onclick="$('#fi').click()">Impor .apkg / .csv</button><button class="btn w" style="margin-top:8px" onclick="expCSV()">Ekspor CSV (teks saja)</button><button class="btn d w" style="margin-top:8px" onclick="wipe()">Hapus semua data</button></div>`)}
async function wipe(){if(!confirm('Hapus SEMUA dek, kartu, dan media?'))return;indexedDB.deleteDatabase('nihongo_anki');localStorage.removeItem('nihongo_master_v2_cards');location.reload()}
function expCSV(){const q=s=>'"'+String(s).replace(/"/g,'""')+'"',l=[['deck','front','back','tags'].join(',')];for(const n of notes.values()){const c=[...cards.values()].find(x=>x.nid==n.id);l.push([S.decks[c?.did]?.name||'',n.f[0]||'',n.f[1]||'',n.tags].map(q).join(','))}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([l.join('\r\n')],{type:'text/csv'}));a.download='nihongo-master.csv';a.click()}

function addMenu(){sheet(`<button class="btn" onclick="$('#fi').click();shut()">📥 Impor .apkg / .csv</button><button class="btn" onclick="addForm()">➕ Tambah kartu</button>`)}
function addForm(){sheet(`<h3 style="margin:0 0 8px">Tambah kartu</h3><label class="mut">Dek</label><input id="ad" list="dl" value="${H(deckN||'Kartu saya')}"><datalist id="dl">${Object.values(S.decks).map(d=>`<option value="${H(d.name)}">`).join('')}</datalist><label class="mut">Depan</label><textarea id="af"></textarea><label class="mut">Belakang</label><textarea id="ab"></textarea><label class="mut">Video / audio / gambar (opsional)</label><input type="file" id="am" accept="video/*,audio/*,image/*"><button class="btn p w" style="text-align:center" onclick="addSave()">Simpan</button>`)}
async function addSave(){const f=$('#af').value.trim(),b=$('#ab').value.trim(),m=$('#am').files[0];if(!f&&!m)return alert('Isi bagian depan dulu.');let fr=f.replace(/\n/g,'<br>');
if(m){await PM('media',[[m.name,new Blob([m],{type:m.type||mime(m.name)})]]);fr+=(fr?'<br>':'')+(m.type.startsWith('image')?`<img src="${H(m.name)}">`:`[sound:${m.name}]`)}
await mkNote('basic',$('#ad').value.trim()||'Kartu saya',[fr,b.replace(/\n/g,'<br>')],'');shut();go('decks')}
/* ---------- impor ---------- */
async function zipOpen(f){const n=f.size,tl=new Uint8Array(await f.slice(Math.max(0,n-70000),n).arrayBuffer());let i=tl.length-22;while(i>=0&&!(tl[i]==80&&tl[i+1]==75&&tl[i+2]==5&&tl[i+3]==6))i--;if(i<0)throw Error('Bukan file ZIP/APKG yang valid.');const v=new DataView(tl.buffer),cnt=v.getUint16(i+10,true),sz=v.getUint32(i+12,true),off=v.getUint32(i+16,true);
if(off==4294967295)throw Error('File ZIP64 (>4GB) belum didukung.');const cd=new DataView(await f.slice(off,off+sz).arrayBuffer()),E={};let p=0;
for(let k=0;k<cnt;k++){const nl=cd.getUint16(p+28,true),nm=new TextDecoder().decode(new Uint8Array(cd.buffer,p+46,nl));E[nm]={m:cd.getUint16(p+10,true),cs:cd.getUint32(p+20,true),lo:cd.getUint32(p+42,true)};p+=46+nl+cd.getUint16(p+30,true)+cd.getUint16(p+32,true)}return{f,E}}
async function zipBlob(z,nm){const e=z.E[nm];if(!e)return null;const h=new DataView(await z.f.slice(e.lo,e.lo+30).arrayBuffer()),s=e.lo+30+h.getUint16(26,true)+h.getUint16(28,true),raw=z.f.slice(s,s+e.cs);return e.m==0?raw:new Response(raw.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob()}
const loadJs=s=>new Promise((r,j)=>{const e=document.createElement('script');e.src=s;e.onload=r;e.onerror=()=>j(Error('Gagal memuat sql.js. Sambungkan internet untuk impor pertama.'));document.head.appendChild(e)});
async function doImport(f){if(!f)return;if(!/\.(apkg|zip|csv)$/i.test(f.name))return alert('Pilih file .apkg, .zip, atau .csv');const say=t=>$('#shb').innerHTML=`<h3 style="margin:0 0 8px">Impor</h3><p>${t}</p>`;sheet('');say('Membaca '+H(f.name)+'…');
try{if(/\.csv$/i.test(f.name)){const rows=(await f.text()).split(/\r?\n/).filter(Boolean).map(r=>r.match(/("([^"]|"")*"|[^,]*)(,|$)/g).map(x=>x.replace(/,$/,'').replace(/^"|"$/g,'').replace(/""/g,'"')));const hd=rows.shift().map(x=>x.trim().toLowerCase()),ix=k=>hd.indexOf(k);let k=0;for(const r of rows){if(r[ix('front')]){await mkNote('basic',r[ix('deck')]||'Impor CSV',[r[ix('front')],r[ix('back')]||''],r[ix('tags')]||'',1);k++}}await saveMeta();say(`Selesai: ${k} kartu.`);return fin()}
const z=await zipOpen(f);let dbn=['collection.anki21','collection.anki2'].find(x=>z.E[x]);
if(!dbn)throw Error(z.E['collection.anki21b']?'Deck ini memakai format baru Anki. Ekspor ulang dari Anki dengan mencentang “Support older Anki versions”.':'Database kartu tidak ditemukan di file ini.');
say('Memuat mesin database…');if(!window.initSqlJs)await loadJs(SQL_CDN+'sql-wasm.js');const SQL=await initSqlJs({locateFile:x=>SQL_CDN+x});
const db=new SQL.Database(new Uint8Array(await(await zipBlob(z,dbn)).arrayBuffer())),cr=db.exec('SELECT crt,models,decks FROM col')[0].values[0];
const M=JSON.parse(cr[1]||'{}'),D=JSON.parse(cr[2]||'{}');if(!Object.keys(M).length)throw Error('Tipe catatan tidak terbaca. Ekspor ulang dengan “Support older Anki versions”.');
const base=Math.floor(cr[0]*1000/DAY);for(const[id,m]of Object.entries(M))S.models[id]={id,name:m.name,type:m.type||0,css:m.css||'',flds:m.flds.sort((a,b)=>a.ord-b.ord).map(x=>x.name),tmpls:m.tmpls.sort((a,b)=>a.ord-b.ord).map(t=>({name:t.name,qfmt:t.qfmt,afmt:t.afmt}))};
const dmap={};for(const[id,d]of Object.entries(D))dmap[id]=d.name;
const nr=db.exec('SELECT id,mid,flds,tags FROM notes')[0]?.values||[],cr2=db.exec('SELECT id,nid,did,odid,ord,type,queue,due,ivl,factor,reps,lapses FROM cards')[0]?.values||[];
const nn=[],cc=[];for(const[id,mid,fl,tg]of nr){if(notes.has(id))continue;nn.push({id,mid:String(mid),f:String(fl).split('\x1f'),tags:String(tg||'').trim()})}const ok=new Set(nn.map(n=>n.id));
for(const[id,nid,did,odid,ord,ty,q,due,ivl,fac,reps,lp]of cr2){if(!ok.has(nid))continue;const d=odid||did,nm=dmap[d]||'Impor Anki',dd=deckId(nm);const rev=(ty==2||ty==3)&&ivl>0;
cc.push({id,nid,did:dd,ord,t:rev?2:(ty==0?0:1),due:rev?base+due:(ty==0?due:Date.now()),ivl:ivl>0?ivl:0,f:fac||2500,r:reps,l:lp,q:q==-1?-1:0,s:0,...(ty==1||ty==3&&!rev?{t:1}:{})})}
for(let i=0;i<nn.length;i+=500){await PM('notes',nn.slice(i,i+500).map(n=>[n.id,n]));say(`Menyimpan catatan ${Math.min(i+500,nn.length)}/${nn.length}…`)}nn.forEach(n=>notes.set(n.id,n));
for(let i=0;i<cc.length;i+=500)await PM('cards',cc.slice(i,i+500).map(c=>[c.id,c]));cc.forEach(c=>cards.set(c.id,c));db.close();await saveMeta();
let mm={};try{mm=JSON.parse(await(await zipBlob(z,'media')).text())}catch(e){}const ent=Object.entries(mm);let k=0;
for(const[id,name]of ent){const b=await zipBlob(z,id);if(b)await PM('media',[[name,new Blob([b],{type:mime(name)})]]);if(++k%10==0)say(`Menyimpan media ${k}/${ent.length}…`)}
say(`Selesai: ${nn.length} catatan, ${cc.length} kartu, ${k} file media.`);fin()}
catch(e){console.error(e);say('Gagal: '+H(e.message))}
function fin(){$('#shb').insertAdjacentHTML('beforeend','<button class="btn p w" style="text-align:center" onclick="shut();go(\'decks\')">OK</button>')}}
const sheet=h=>{$('#shb').innerHTML=h;$('#sh').classList.remove('hidden')},shut=()=>$('#sh').classList.add('hidden');
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
init();
